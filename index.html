<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0512">
  <meta name="description" content="Video de fondo en loop con capa de contenido superior">
  <title>Mi Página</title>

  <style>
    /* ===== Reset y base ===== */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: #0a0512;
      color: #ffffff;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ============================================================
       CAPA 1: VIDEO DE FONDO EN LOOP (9:16)
       "video.mp4" debe estar en la MISMA carpeta que este HTML.
       ============================================================ */
    .video-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #0a0512;
      pointer-events: none;
    }

    /* Video difuminado que rellena TODA la pantalla (evita bandas negras) */
    .video-bg .video-blur {
      position: absolute;
      inset: -10%;
      width: 120%;
      height: 120%;
      object-fit: cover;
      filter: blur(60px) brightness(0.4) saturate(1.4);
      transform: scale(1.1) translateZ(0);
      will-change: transform;
    }

    /* Video principal — centrado, sin sobrepasar su resolución nativa
       (evita pixelado en pantallas grandes). */
    .video-bg .video-main {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateZ(0);
      width: 100vw;
      height: 100dvh;
      height: 100vh;
      object-fit: contain;
      image-rendering: auto;
      backface-visibility: hidden;
    }

    /* Capa de oscurecido sobre el video para mejorar contraste */
    .video-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(10, 5, 18, 0.20) 0%,
        rgba(10, 5, 18, 0.60) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    /* ============================================================
       CAPA 2: CONTENIDO (aquí pones lo que quieras)
       ============================================================ */
    .content-layer {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: 100dvh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ============================================================
       ESTILOS DE EJEMPLO (bórralos o modifícalos a tu gusto)
       ============================================================ */
    .card {
      width: min(100%, 640px);
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .card h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.75rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .card p {
      margin: 0 0 1.5rem;
      font-size: clamp(1rem, 2.5vw, 1.125rem);
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.85);
    }

    .card .btn {
      display: inline-block;
      padding: 0.875rem 2rem;
      background: linear-gradient(135deg, #411793 0%, #b156cd 100%);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 24px rgba(65, 23, 147, 0.5);
    }

    .card .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(177, 86, 205, 0.6);
    }

    .card .btn:active {
      transform: translateY(0);
    }

    /* ===== Responsive ===== */
    @media (max-width: 520px) {
      .content-layer { padding: 1rem; }
      .card { padding: 2rem 1.25rem; }
    }

    /* ===== Accesibilidad ===== */
    a:focus-visible,
    button:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid #b156cd;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .video-bg .video-main,
      .video-bg .video-blur { display: none; }
      .video-bg {
        background: linear-gradient(135deg, #1a0f2e 0%, #411793 100%);
      }
      .card .btn:hover { transform: none; }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       CAPA 1: VIDEO DE FONDO EN LOOP (9:16)
       ============================================================ -->
  <div class="video-bg" aria-hidden="true">
    <!-- Versión difuminada: rellena los laterales en pantallas anchas -->
    <video class="video-blur"
           autoplay muted loop playsinline preload="auto"
           disablepictureinpicture>
      <source src="video.mp4" type="video/mp4">
    </video>

    <!-- Versión principal: se ajusta a su resolución nativa sin pixelarse -->
    <video class="video-main"
           autoplay muted loop playsinline preload="auto"
           disablepictureinpicture>
      <source src="video.mp4" type="video/mp4">
      Tu navegador no soporta video HTML5.
    </video>
  </div>

  <!-- ============================================================
       CAPA 2: CONTENIDO
       👇 Aquí va TODO lo que quieras mostrar encima del video:
          - Tu propia invitación
          - Un formulario
          - Un iframe
          - Texto, imágenes, botones, etc.
       ============================================================ -->
  <div class="content-layer">

    <!-- ====== CONTENIDO DE EJEMPLO (reemplázalo por el tuyo) ====== -->
    <div class="card">
      <h1>Tu contenido aquí</h1>
      <p>
        Este es un contenedor de ejemplo. Sustituye este bloque por
        el contenido que quieras mostrar sobre el video de fondo.
      </p>
      <button class="btn" type="button">Empezar</button>
    </div>
    <!-- ====== FIN DEL CONTENIDO DE EJEMPLO ====== -->

  </div>

  <!-- ============================================================
       SCRIPT: ajusta el video principal para NO upscalearlo
       más allá de su resolución nativa → sin pixelado.
       ============================================================ -->
  <script>
    (function () {
      const mainVideo = document.querySelector('.video-main');
      if (!mainVideo) return;

      let rafId = null;

      function fitVideo() {
        const nw = mainVideo.videoWidth;
        const nh = mainVideo.videoHeight;
        if (!nw || !nh) return;

        const vw = window.innerWidth;
        const vh = window.innerHeight;

        // "Contain" + tope en resolución nativa (nunca escalar hacia arriba)
        const scale = Math.min(vw / nw, vh / nh, 1);
        const w = Math.round(nw * scale);
        const h = Math.round(nh * scale);

        mainVideo.style.width = w + 'px';
        mainVideo.style.height = h + 'px';
      }

      function scheduleFit() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(fitVideo);
      }

      if (mainVideo.readyState >= 1) {
        fitVideo();
      } else {
        mainVideo.addEventListener('loadedmetadata', fitVideo, { once: true });
      }

      window.addEventListener('resize', scheduleFit);
      window.addEventListener('orientationchange', scheduleFit);
    })();
  </script>

</body>
</html>
